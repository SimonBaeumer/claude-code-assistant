# claude-relay configuration.
# Every key is optional: anything you leave out falls back to these defaults.

# The general session: used by the "general" shortcuts and for files outside any git repo.
general:
  session: general
  dir: ~/claude-general

# Route overrides. Longest matching path prefix wins, otherwise the file's git root
# picks the session automatically.
routes: []
#  - path: ~/src/monorepo/service-a   # files under this path...
#    session: service-a               # ...go to session "cr-service-a"
#    dir: ~/src/monorepo/service-a    # working dir of that session (default: path)

claude:
  command: claude
  args: []                 # extra flags, e.g. ["--model", "opus"]
  resume: true             # restart a lost session with --resume <its last conversation>
  startup_timeout_ms: 30000

viewer:
  terminal: [konsole, --separate, -e]   # command prefix; "tmux attach-session ..." is appended
  open_if_missing: true                 # open a viewer window if none is running
  focus: true                           # raise and focus the viewer after a send

limits:
  max_chars: 30000

queue:
  max_items: 5

notify: true

# Actions are prompt templates. "instruction" is typed into Claude Code as one line
# (newlines become spaces, so it is never submitted early). "body" is pasted after it
# with bracketed paste and may span many lines.
#
# Placeholders: {file} {abs_file} {lines} {target} {language} {project} {question}
# {selection} {code_block}. {target} is "main.go, lines 3-5" or "main.go (whole file)".
#
# Optional per action:
#   ask: true            show a dialog first, its text fills {question}
#   ask_label: "..."     the dialog text
#   no_selection: caret  what to send with nothing selected: caret (the caret line),
#                        file (name the whole file, Claude reads it), error
#   route: repo          refuse the general session (any is the default)
#   needs_file: false    the action works without a file or selection
actions:
  explain:
    instruction: >-
      Explain the selected code below to an experienced engineer who needs to
      understand it fast. Be precise and brief: one sentence on what it does, then
      only the non-obvious parts (key flow, assumptions, gotchas) as a few short
      bullets. Skip basics and restating the code. Look at surrounding code only if
      needed to be correct. Explanation only, do not modify files.
      Source: {file}, lines {lines} ({language}).
    body: "\n{code_block}"
  ask:
    ask: true
    instruction: >-
      Question about the selected code below from {file}, lines {lines} ({language}):
      {question} Answer an experienced engineer: precise and brief, lead with the
      direct answer, add detail only where it matters. Do not modify files.
    body: "\n{code_block}"
  review:
    no_selection: file
    route: repo
    instruction: >-
      Review the code below from {target} ({language}) for correctness, best
      practices and security, as a senior engineer would in a code review. Report
      at most 10 findings, most severe first. For each: severity (critical, high,
      medium, low), file:line, the problem in one sentence, why it matters, and the
      concrete fix in one or two lines. Check in particular input validation and
      injection, authn/authz, secrets in code, unsafe deserialization, path
      traversal, error handling, resource leaks, concurrency, and non-idiomatic
      patterns for this language. Skip pure style nits. If there is nothing
      significant, say so in one line. Read the surrounding code where needed to be
      sure. Review only, do not modify files; I may ask you to fix a finding later.
    body: "\n{code_block}"
  review-changes:
    needs_file: false
    route: repo
    instruction: >-
      Review the uncommitted changes in this repo (run git diff HEAD and git status,
      and read new untracked files) for correctness, best practices and security, as
      a senior engineer would in a code review. Report at most 10 findings, most
      severe first. For each: severity (critical, high, medium, low), file:line, the
      problem in one sentence, why it matters, and the concrete fix in one or two
      lines. Check in particular input validation and injection, authn/authz,
      secrets, unsafe deserialization, path traversal, error handling, resource
      leaks, concurrency, and non-idiomatic patterns. Skip pure style nits. If there
      is nothing significant, say so in one line. Review only, do not modify files;
      I may ask you to fix a finding later.
    body: ""
  edit:
    ask: true
    ask_label: "Describe the change:"
    route: repo
    instruction: >-
      Change the code below in {target} ({language}) as follows: {question}
      Edit the file directly. Keep the change minimal and limited to this code
      unless the request needs more, follow the file's existing style, and do not
      touch unrelated code. The code is shown to locate it; find it by content, not
      by line number. When done, summarise what you changed in two or three lines.
    body: "\n{code_block}"
